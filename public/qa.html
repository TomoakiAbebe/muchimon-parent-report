<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Muchimon Design QA</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:28px;background:#eef3f5;color:#12213f;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}h1{margin:0 0 24px;font-size:24px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:28px}.panel{padding:16px;border-radius:18px;background:white;box-shadow:0 4px 20px #47647618}.panel h2{margin:0 0 12px;font-size:16px}.reference{display:block;width:100%;height:760px;object-fit:contain;object-position:top center;background:#f3fbfd}.frame{position:relative;height:760px;overflow:hidden;background:#fff}.frame iframe{position:absolute;left:50%;top:0;width:1400px;height:1200px;border:0;transform:translateX(-50%) scale(.633);transform-origin:top center}
  </style>
</head>
<body>
  <h1>保護者向けレポート — Visual QA board</h1>
  <section class="pair"><article class="panel"><h2>Reference — 学習</h2><img class="reference" src="assets/reference/learning-reference.png" /></article><article class="panel"><h2>Implementation — 学習</h2><div class="frame"><iframe src="./#learning"></iframe></div></article></section>
  <section class="pair"><article class="panel"><h2>Reference — おしゃべり</h2><img class="reference" src="assets/reference/chat-reference.png" /></article><article class="panel"><h2>Implementation — おしゃべり</h2><div class="frame"><iframe src="./#chat"></iframe></div></article></section>
</body>
</html>
